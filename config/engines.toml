# Serving engines. UNREGISTERED until a numbered ledger entry sets `registered_by`.
[engine.llamacpp]
repo = "https://github.com/ggml-org/llama.cpp"
release = "b11235"
commit = "6c7a87f7e5e5cd75b8a641c3471f2dee84a6ed17"
download = "llama-b11235-bin-macos-arm64.tar.gz"
download_sha256 = "d28351029acd7e0c01825d8e7dddadded3da4a2494bf72ebd98e73aec9344d50"
registered_by = ""

# No server flag is set: the controls run at the server's defaults, and every record stores what the
# server reports about itself. An experiment that overrides a flag names it in the entry that
# registers the experiment.

# One 8B-class model per family, both at Q4_K_M. sha256 is the Hub's recorded digest for the file,
# read on 2026-09-28. The driver hashes the local file and refuses on a mismatch.
[[engine.llamacpp.models]]
family = "qwen"
hf_repo = "Qwen/Qwen3-8B-GGUF"                                  # published by the model's owner; Apache-2.0
file = "Qwen3-8B-Q4_K_M.gguf"
sha256 = "d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785"

[[engine.llamacpp.models]]
family = "llama"
hf_repo = "bartowski/Meta-Llama-3.1-8B-Instruct-GGUF"           # third-party conversion; Llama 3.1 Community License
file = "Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
sha256 = "7b064f5842bf9532c91456deda288a1b672397a54fa729aa665952863033557c"
