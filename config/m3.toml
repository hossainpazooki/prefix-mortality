# Templating (M3) on llama.cpp: a chat-template argument changes, the messages and tools do not.
#
# Registered by ledger entry 0015, which fixes these values; a change to any of them needs a new
# entry, and the driver refuses to run while `registered_by` is empty. Request parameters are those of
# config/controls.toml. `base_kwargs` go on every request as `chat_template_kwargs`; a change
# replaces one of them on the changed request. `date_string` fixes the date the Llama 3.1 template
# prints, so the run does not depend on the clock; Qwen3's template prints no date. `enable_thinking`
# is read by Qwen3's template only. Llama 3.1's tools stay where its template puts them by default,
# in the first user message, after the nonce: with `tools_in_user_message = false` the template puts
# them before the system text, ahead of the nonce, and consecutive trials then share a head of about
# 0.7 of the prompt (read in an unrecorded probe, 2026-10-02).
[m3]
repetitions = 5
similarity_threshold = 0.10           # llama.cpp --slot-prompt-similarity, its default at the pinned commit
threshold_margin = 0.002
corpus_dir = "corpus/live/m3"
results_dir = "results/m3"
registered_by = "0015"

[m3.base_kwargs]
date_string = "01 Oct 2026"
enable_thinking = true

[m3.changes.T1]
key = "date_string"
value = "02 Oct 2026"

[m3.changes.T2]
key = "enable_thinking"
value = false

[m3.hypotheses.H-M3L1]                # server started with --parallel 1
slots = 1
rule = "prefix"

[m3.hypotheses.H-M3LD]                # server at its defaults
slots = 4
rule = "threshold"
