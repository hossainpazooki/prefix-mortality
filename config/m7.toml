# Eviction by intervening requests (M7) on llama.cpp at its defaults: an anchor request, K foreign
# requests served one at a time, then the anchor again byte for byte.
#
# Registered by ledger entry 0012, which fixes these values. A change to any of them needs a new
# entry; the driver refuses to run while `registered_by` is empty. Request parameters (tokens to
# generate, temperature, nonce length, user message) are those of config/controls.toml.
[m7]
repetitions = 3                                  # trials per K, per model
k_schedule = [0, 1, 4, 8, 10, 11, 12, 13, 16]    # foreign requests between the anchor and its resend
cache_ram_mib = 8192                             # llama.cpp --cache-ram, its default at the pinned commit
corpus_dir = "corpus/live/m7"
results_dir = "results/m7"
registered_by = "0012"

# A cached prompt's KV state is tokens x n_layer x 2 (K and V) x n_head_kv x head_dim x bytes_per_value.
# The four values are the model file's metadata; the file is pinned by sha256 in config/engines.toml.
[m7.kv_geometry.qwen]
n_layer = 36
n_head_kv = 8
head_dim = 128
bytes_per_value = 2                              # f16, the server's default KV type

[m7.kv_geometry.llama]
n_layer = 32
n_head_kv = 8
head_dim = 128
bytes_per_value = 2

# The resend's predicted reuse is n - 1 when the states of the anchor and of the first K - 1 foreign
# prompts fit together under cache_ram_mib, and 0 otherwise; the K-th foreign prompt is still in its
# slot when the resend arrives. `slots` is what the server must report.
[m7.hypotheses.H-M7LD]                           # server at its defaults
slots = 4
