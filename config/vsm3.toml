# A second model family on the V instrument: SmolLM3-3B in bf16 safetensors, served by the vLLM
# pinned in config/vllm.toml. Lives in its own file because every committed V record hashes
# config/vllm.toml, which therefore never changes (config/l17.toml's reason, on this lane). Engine,
# dtype, context, KV space and block sizes stay config/vllm.toml's; request parameters are
# config/controls.toml's. Records of runs under this family additionally hash this file.
#
# Registered by the ledger entry named in `registered_by`; the drivers refuse the family while it is
# empty. Every file the render depends on is pinned: the weights, the model config, the tokenizer,
# its config, the chat template (a separate file in this repository), the generation config and the
# special-tokens map, all taken from one repository revision. Digests of the three LFS files are the
# Hub's recorded ones; the others were hashed from the files at that revision, all read 2026-10-23.
# The driver hashes every local file and refuses on a mismatch.
[vsm3]
registered_by = ""
served_model_name = "smollm3-3b"

[vsm3.model]
family = "smollm3"
hf_repo = "HuggingFaceTB/SmolLM3-3B"   # published by the model's owner; Apache-2.0
revision = "988f1dde"

